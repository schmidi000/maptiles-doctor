name: Release

# Publishes the npm packages, tags the commit, and opens the GitHub release.
#
# The package manifests are the source of truth for the version. Bump them and
# CHANGELOG.md in a pull request, merge it, then run this workflow from the
# Actions tab — it derives the version from the manifests, refuses to run if the
# packages disagree with each other or if that version was already released, and
# creates the tag itself. Nothing has to be pushed by hand.
#
# Pushing a `vX.Y.Z` tag also triggers it, for anyone who would rather tag
# locally. Either way the tag ends up on the released commit, so a published
# version always corresponds to a commit that can be checked out.
#
# See RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every check and pack the tarballs without publishing or tagging.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Required for npm provenance: npm exchanges this token for a signed
      # attestation tying the published tarball to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org

      # Resolves the version and refuses anything ambiguous. The packages are
      # published as a set at one version, so a manifest that disagrees with its
      # siblings is a half-finished bump, not a release. Run on both triggers:
      # a hand-pushed tag can disagree with the manifests just as easily.
      - name: Resolve the release version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "Version ${version} comes from the pushed tag."
          else
            version="$(jq -r .version packages/cli/package.json)"
            echo "Version ${version} comes from the package manifests."
          fi

          for manifest in packages/*/package.json; do
            declared="$(jq -r .version "$manifest")"
            if [ "$declared" != "$version" ]; then
              echo "::error::$manifest is $declared but this release is $version" >&2
              exit 1
            fi
          done

          # Republishing is impossible — npm never lets a version number be
          # reused — so an already-released version is a mistake worth catching
          # before the gate spends ten minutes proving it.
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1 &&
             [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "::error::v${version} is already tagged. Bump the manifests first." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "major=v$(echo "${version}" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Visual canaries skip themselves when no browser can be launched, so the
      # runner needs Chromium for the full gate to actually exercise them.
      - run: npx playwright install --with-deps chromium

      # The same gate CI runs. A release that skips it is a release nobody
      # checked: audit, typecheck, lint, format, tests, build, package
      # validation, and a staleness check on the committed Action bundle.
      - run: npm run check

      # npm only ships a license file that sits inside the package directory,
      # and the repository keeps a single copy at the root.
      - run: npm run license:sync

      - name: Pack the tarballs without publishing
        if: ${{ inputs.dry-run }}
        run: |
          npm pack --workspaces --pack-destination "${RUNNER_TEMP}"
          echo "Dry run: ${{ steps.version.outputs.tag }} was not published or tagged."

      # Publish order follows the dependency graph: core and report are pinned
      # exactly by the CLI and the action, so they have to exist on the registry
      # first or the dependents install against a version that is not there yet.
      #
      # `NODE_AUTH_TOKEN` goes away once every package exists on the registry and
      # a trusted publisher is registered against it: npm authenticates over the
      # same OIDC token the provenance attestation already uses. It cannot be set
      # up before the first publish, because the configuration lives on a package
      # that does not exist yet. See RELEASING.md.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in @maptiles-doctor/core @maptiles-doctor/report maptiles-doctor @maptiles-doctor/action; do
            npm publish --workspace "$package" --provenance --access public
          done

      # `npm publish` reporting success is not the same as the package being
      # installable. The first release published all four packages, each with a
      # signed provenance statement, and three of them were still 404 on the
      # registry minutes later — leaving a CLI on npm that pinned siblings
      # nobody could fetch. Install the published set the way a user would,
      # from a directory with none of this repository in it, and fail the
      # release before it is tagged if that does not work.
      - name: Verify the published packages install
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          for attempt in 1 2 3 4 5 6; do
            if npm install --no-audit --no-fund \
              "maptiles-doctor@${VERSION}" \
              "@maptiles-doctor/core@${VERSION}" \
              "@maptiles-doctor/report@${VERSION}" \
              "@maptiles-doctor/action@${VERSION}"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::Published ${VERSION} is not installable from the registry." >&2
              exit 1
            fi
            echo "Not on the registry yet; retrying in 30s (attempt ${attempt}/6)."
            sleep 30
          done

          # Assert on the output, not the exit status. 0.1.0 shipped a CLI whose
          # entrypoint check compared `import.meta.url` against `argv[1]`, which
          # never matches when npm installs the bin as a symlink: it printed
          # nothing and exited 0 on every invocation. An exit-status check would
          # have called that a successful release.
          printed="$(./node_modules/.bin/maptiles-doctor --version)"
          if [ "$printed" != "$VERSION" ]; then
            echo "::error::Installed CLI printed '${printed}' for --version, expected ${VERSION}." >&2
            exit 1
          fi

      # Tagged after the publish, not before: a tag pointing at a version that
      # never reached the registry is worse than no tag. Consumers of the Action
      # pin `@v0`, so the major tag moves onto the released commit too, and the
      # exact `vX.Y.Z` stays available for anyone who would rather pin.
      - name: Tag the release
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi
          git tag -f "$MAJOR" "$TAG"
          git push origin -f "refs/tags/${MAJOR}"

      - name: Create the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --verify-tag
