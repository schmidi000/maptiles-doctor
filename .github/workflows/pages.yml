name: Documentation

# The site in `site/` is the single source of truth for how MapTiles Doctor
# behaves. It is plain HTML with no build step, so a deploy cannot break on a
# generator upgrade.
#
# It deploys on a push to `main` that touches the site, so the published page
# can never lag behind the behaviour it documents. `workflow_dispatch` is kept
# for redeploying without a change. The file is also readable straight from a
# checkout: open `site/index.html` in a browser.
#
# `site/CNAME` is what binds the deploy to maptiles-doctor.com. It has to live
# in the uploaded directory: GitHub rewrites the repository's Pages domain
# setting from the deployed artifact, so a deploy without it silently reverts
# the custom domain to the github.io address.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy supersedes a pending one, but never cancels a running one:
# cancelling mid-deploy can leave the site half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
