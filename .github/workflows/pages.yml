name: Documentation

# The site in `site/` is the single source of truth for how MapTiles Doctor
# behaves. It is plain HTML with no build step, so a deploy cannot break on a
# generator upgrade.
#
# Deliberately manual. This repository is private and the documentation is not
# meant to be public yet, and a GitHub Pages site is world-readable except on
# Enterprise Cloud with access control. There is no push trigger, so enabling
# Pages later cannot start publishing on its own: someone has to run this
# workflow on purpose. Open `site/index.html` in a browser to read it locally.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy supersedes a pending one, but never cancels a running one:
# cancelling mid-deploy can leave the site half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
